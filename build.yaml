# GitHub Actions build matrix for the Corne Choc Pro (Keebart).
# Local builds use build.sh; this file drives the cloud build.
---
include:
  # Left half (central) with nice!view display + ZMK Studio
  - board: corne_choc_pro_left
    shield: nice_view_disp
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # Right half (peripheral) with nice!view display
  - board: corne_choc_pro_right
    shield: nice_view_disp
    snippet: studio-rpc-usb-uart

  # Settings reset for left (clears bonded BLE state)
  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # Settings reset for right
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
